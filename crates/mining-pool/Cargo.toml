[package]
name = "mining-pool"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mining-pool"
path = "src/main.rs"

[features]
# Real RandomX (light mode) verifier. Same trade-off as in the stratum-proxy
# crate: production builds want it, CI without C++ deps can drop it.
default = ["real"]
real = ["stratum-proxy/real"]

