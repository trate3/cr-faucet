[package]
name = "stratum-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stratum-proxy"
path = "src/main.rs"

[features]
# `real` is on by default — production builds want real RandomX. Tests and
# environments without the C++ RandomX library available can use
# `--no-default-features` to fall back to the stub verifier.
default = ["real"]
real = ["randomx-verify/real"]

[dependencies]
pool-core.workspace = true
randomx-verify.workspace = true
accountant.workspace = true
pps-rate.workspace = true
redis.workspace = true

tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
tokio-socks.workspace = true
sha2.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
chrono.workspace = true
parking_lot.workspace = true
uuid.workspace = true
rand.workspace = true
socket2.workspace = true

[dev-dependencies]
rcgen.workspace = true
