[package]
name = "randomx-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
# randomx-rs binds to the canonical RandomX C++ library.
# Kept optional behind a feature so the workspace builds in CI without the C++ deps.
randomx-rs = { version = "1.3", optional = true }

[dev-dependencies]
rand.workspace = true

[features]
default = []
real = ["dep:randomx-rs"]
