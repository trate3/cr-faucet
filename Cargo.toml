[workspace]
resolver = "2"
members = [
    "crates/pool-core",
    "crates/randomx-verify",
    "crates/stratum-proxy",
    "crates/accountant",
    "crates/pps-rate",
    "crates/voucher-signer",
    "crates/redemption-watcher",
    "crates/operator-api",
    "crates/mining-pool",
    "crates/stratum-stub",
    "crates/hashvault-client",
    "crates/crossroads-oracle",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false

[workspace.dependencies]
pool-core = { path = "crates/pool-core" }
randomx-verify = { path = "crates/randomx-verify" }
accountant = { path = "crates/accountant" }
pps-rate = { path = "crates/pps-rate" }
stratum-proxy = { path = "crates/stratum-proxy", default-features = false }
hashvault-client = { path = "crates/hashvault-client" }
voucher-signer = { path = "crates/voucher-signer" }
operator-api = { path = "crates/operator-api" }
redemption-watcher = { path = "crates/redemption-watcher" }
crossroads-oracle = { path = "crates/crossroads-oracle" }

tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-socks = "0.5"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"
sha3 = "0.10"
data-encoding = "2"
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

alloy = { version = "0.5", features = ["full", "signer-local"] }
hex = "0.4"
ciborium = "0.2"
monero = { version = "0.21", default-features = false, features = ["full"] }
curve25519-dalek = "4"
# Encrypt the reveal-once Monero wallet address to the deployer's age key so the
# upstream-login address never sits in plaintext in the (unencrypted) node logs.
age = { version = "0.11", default-features = false }

axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
socket2 = "0.5"

rand = { version = "0.8", features = ["small_rng"] }
parking_lot = "0.12"
once_cell = "1"
bytes = "1"

redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
